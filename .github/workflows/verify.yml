name: Validasi paket ASIQ

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Ambil revisi paket
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validasi struktur dan fixture
        run: python scripts/verify.py
